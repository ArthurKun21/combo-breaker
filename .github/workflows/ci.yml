name: CI

on:
  push:
    branches:
      - development
    paths:
      - gradle/**
      - build-logic/**
      - combo-breaker/**
      - combo-breaker-demo/**
      - combo-breaker-material3/**
      - build.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - settings.gradle.kts
  pull_request:
    paths:
      - gradle/**
      - build-logic/**
      - combo-breaker/**
      - combo-breaker-demo/**
      - combo-breaker-material3/**
      - build.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - settings.gradle.kts

  workflow_dispatch:

env:
  JAVA_VERSION: 21
  JAVA_DISTRO: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'


concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build library
        run: |
          ./gradlew :combo-breaker:assembleRelease combo-breaker-material3:assembleRelease
